services:
  # ----------------------------------------------------------------------------
  # 1. Express API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: dmch-resto-pos-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dmch-resto-pos-db
          property: connectionString

databases:
  # ----------------------------------------------------------------------------
  # 2. Render Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: dmch-resto-pos-db
    databaseName: dmch_resto_pos
    user: dmch_admin
    region: oregon
    plan: free
